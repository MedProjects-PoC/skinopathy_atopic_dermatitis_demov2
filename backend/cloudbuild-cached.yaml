# Cloud Build configuration with Docker layer caching
# Use with: gcloud builds submit --config=cloudbuild-cached.yaml

options:
  # Use Kaniko cache for faster builds
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

# Enable Docker layer caching
steps:
  # Step 1: Pull previous image for layer cache
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull $_IMAGE_NAME:latest || exit 0
    id: 'pull-cache'

  # Step 2: Build with cache
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - '$_IMAGE_NAME:latest'
      - '--tag'
      - '$_IMAGE_NAME:latest'
      - '--tag'
      - '$_IMAGE_NAME:$SHORT_SHA'
      - '.'
    id: 'build'
    waitFor: ['pull-cache']

  # Step 3: Push image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_IMAGE_NAME:latest']
    id: 'push-latest'
    waitFor: ['build']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '$_IMAGE_NAME:$SHORT_SHA']
    id: 'push-sha'
    waitFor: ['build']

# Substitutions
substitutions:
  _IMAGE_NAME: 'us-central1-docker.pkg.dev/total-furnace-288818/skinopathy-ad/skinopathy-atopic-dermatitis-demo2-api'

images:
  - '$_IMAGE_NAME:latest'
  - '$_IMAGE_NAME:$SHORT_SHA'

timeout: '1200s'  # 20 minutes
